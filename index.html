<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <title>CyberPulse.it | Магазин устройств безопасности</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { overflow-x: hidden; width: 100%; }
        body { background: #0A0A0F; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #FFFFFF; line-height: 1.5; -webkit-text-size-adjust: 100%; }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 16px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.1); flex-wrap: wrap; gap: 12px; }
        .logo h1 { font-size: 24px; background: linear-gradient(135deg, #FFFFFF, #6C63FF); -webkit-background-clip: text; background-clip: text; color: transparent; cursor: pointer; }
        .logo p { font-size: 11px; color: rgba(255,255,255,0.4); }
        .nav-buttons { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); padding: 10px 16px; border-radius: 40px; color: rgba(255,255,255,0.8); cursor: pointer; transition: all 0.2s; font-size: 14px; }
        .btn-outline:hover { border-color: #6C63FF; color: #6C63FF; }
        .btn-outline:active { transform: scale(0.96); }
        
        .search-input { width: 100%; max-width: 400px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 14px 18px; border-radius: 40px; color: white; margin: 20px 0 16px; font-size: 16px; }
        .search-input:focus { outline: none; border-color: #6C63FF; }
        
        .categories { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .category-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 10px 18px; border-radius: 40px; color: rgba(255,255,255,0.7); cursor: pointer; transition: all 0.2s; font-size: 14px; white-space: nowrap; }
        .category-btn.active { background: #6C63FF; border-color: #6C63FF; color: white; }
        .category-btn:active { transform: scale(0.96); }
        
        .sort-select { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 10px 16px; border-radius: 40px; color: white; margin-bottom: 16px; cursor: pointer; font-size: 14px; }
        
        .catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin: 24px 0 60px; }
        .product-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 16px; transition: all 0.3s; display: flex; flex-direction: column; }
        
        .product-img { width: 100%; height: 240px; background: rgba(255,255,255,0.02); border-radius: 16px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 14px; cursor: pointer; padding: 8px; }
        .product-img img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; }
        .product-img .fallback { font-size: 64px; }
        
        .product-title { font-size: 17px; font-weight: 600; margin-bottom: 6px; cursor: pointer; }
        .product-desc { font-size: 13px; color: rgba(255,255,255,0.5); margin: 6px 0; line-height: 1.4; flex-grow: 1; }
        .product-price { font-size: 22px; font-weight: 700; color: #6C63FF; margin: 10px 0; }
        .old-price { font-size: 13px; color: rgba(255,255,255,0.4); text-decoration: line-through; margin-left: 6px; }
        .sale-badge { background: #FF4D4D; border-radius: 20px; padding: 2px 8px; font-size: 11px; margin-left: 6px; }
        
        .btn-details { width: 100%; background: transparent; border: 1px solid rgba(108,99,255,0.5); padding: 12px; border-radius: 40px; color: #6C63FF; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-bottom: 8px; font-size: 14px; }
        .btn-cart { width: 100%; background: linear-gradient(135deg, #6C63FF, #4A42D0); border: none; padding: 14px; border-radius: 40px; color: white; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 14px; }
        
        .cart-icon { position: relative; cursor: pointer; display: flex; align-items: center; gap: 6px; background: rgba(108, 99, 255, 0.2); padding: 10px 16px; border-radius: 40px; font-size: 14px; }
        .cart-count { background: #FF4D4D; border-radius: 20px; padding: 2px 8px; font-size: 12px; }
        
        .cart-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 550px; max-width: 94vw; max-height: 85vh; background: #111118; border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; z-index: 1001; overflow: hidden; }
        .cart-modal.show { display: flex; flex-direction: column; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.95); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        .cart-header { display: flex; justify-content: space-between; align-items: center; padding: 18px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .cart-items { flex: 1; overflow-y: auto; padding: 14px; }
        .cart-item { display: flex; align-items: center; gap: 10px; padding: 12px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); flex-wrap: wrap; }
        .cart-item-img { font-size: 28px; width: 40px; text-align: center; flex-shrink: 0; }
        .cart-item-info { flex: 1; min-width: 100px; }
        .cart-item-name { font-weight: 600; font-size: 13px; }
        .cart-item-price { font-size: 11px; color: #6C63FF; }
        .cart-item-controls { display: flex; align-items: center; gap: 6px; }
        .cart-qty-btn { background: rgba(255,255,255,0.1); border: none; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; color: white; font-size: 16px; }
        .cart-footer { padding: 18px; border-top: 1px solid rgba(255,255,255,0.1); }
        .cart-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; margin-bottom: 14px; }
        .btn-checkout { width: 100%; background: linear-gradient(135deg, #6C63FF, #4A42D0); border: none; padding: 16px; border-radius: 40px; color: white; font-weight: 600; cursor: pointer; font-size: 16px; }
        .close-cart { background: none; border: none; color: rgba(255,255,255,0.6); font-size: 26px; cursor: pointer; padding: 4px 12px; }
        
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 1000; }
        .overlay.show { display: block; }
        .toast { position: fixed; bottom: 20px; right: 16px; left: 16px; max-width: 400px; margin-left: auto; background: #111118; border-left: 4px solid #6C63FF; padding: 14px 18px; border-radius: 12px; z-index: 1100; animation: slideIn 0.3s ease; font-size: 14px; }
        .contact-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 380px; max-width: 94vw; background: #111118; border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 28px 20px; z-index: 2000; text-align: center; }
        .contact-modal.show { display: block; animation: fadeIn 0.2s ease; }
        .contact-link { display: inline-block; background: linear-gradient(135deg, #6C63FF, #4A42D0); padding: 14px 28px; border-radius: 40px; color: white; text-decoration: none; margin: 8px 0; font-size: 16px; }
        .close-contact { background: rgba(255,255,255,0.1); border: none; padding: 12px 24px; border-radius: 40px; color: white; cursor: pointer; margin-top: 16px; font-size: 14px; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        
        @media (max-width: 768px) {
            .container { padding: 0 12px; }
            .logo h1 { font-size: 20px; }
            .logo p { font-size: 10px; }
            .nav-buttons { gap: 6px; width: 100%; }
            .btn-outline { padding: 10px 14px; font-size: 13px; flex: 1; text-align: center; }
            .cart-icon { padding: 10px 14px; font-size: 13px; }
            .search-input { font-size: 15px; padding: 12px 16px; }
            .category-btn { padding: 8px 16px; font-size: 13px; }
            .catalog { grid-template-columns: 1fr; gap: 14px; }
            .product-card { padding: 14px; border-radius: 16px; }
            .product-img { height: 260px; }
            .product-price { font-size: 20px; }
            .cart-modal { width: 96vw; }
        }
    </style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="container">
    <div class="header">
        <div class="logo" onclick="location.reload()">
            <h1>CyberPulse.it</h1>
            <p>professional hardware · security research</p>
        </div>
        <div class="nav-buttons">
            <button class="btn-outline" id="usdBtn">USD</button>
            <button class="btn-outline" id="rubBtn">RUB</button>
            <button class="btn-outline" id="contactBtn">📞</button>
            <div class="cart-icon" id="cartIcon">
                🛒 <span class="cart-count" id="cartCount">0</span>
            </div>
        </div>
    </div>

    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск...">

    <div class="categories" id="categories"></div>
    
    <select id="sortSelect" class="sort-select">
        <option value="default">По умолчанию</option>
        <option value="price_asc">Цена ↑</option>
        <option value="price_desc">Цена ↓</option>
    </select>

    <div id="catalog" class="catalog"></div>
</div>

<div class="cart-modal" id="cartModal">
    <div class="cart-header">
        <span style="font-weight:600;">🛒 Корзина</span>
        <button class="close-cart" id="closeCartBtn">✕</button>
    </div>
    <div id="cartItemsList" class="cart-items">
        <div style="text-align:center; padding:40px;">Корзина пуста</div>
    </div>
    <div class="cart-footer" id="cartFooter" style="display:none;">
        <div class="cart-total">
            <span>Итого:</span>
            <span id="cartTotal">0 $</span>
        </div>
        <button class="btn-checkout" id="checkoutBtn">Оформить заказ</button>
    </div>
</div>

<div class="contact-modal" id="contactModal">
    <h3>📞 Свяжитесь с нами</h3>
    <p>По всем вопросам обращайтесь к нашему менеджеру:</p>
    <a href="https://t.me/TENOR870" target="_blank" rel="noopener noreferrer" class="contact-link">@TENOR870</a>
    <button class="close-contact" onclick="closeContactModal()">Закрыть</button>
</div>

<script>
let products=[], cart=JSON.parse(localStorage.getItem('cart')||'[]'), currentCategory='all', searchQuery='', currentCurrency='USD', rubRate=92, sortType='default';
const categories=[{id:'all',name:'🏠 Все'},{id:'devices',name:'📟 Устройства'},{id:'modules',name:'🔌 Модули'},{id:'firmware',name:'⚙️ Прошивки'},{id:'accessories',name:'🔧 Аксессуары'}];
const $=id=>document.getElementById(id); const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
async function loadProductsFromStorage(){try{const x=await fetch('/api/products');if(!x.ok)throw 0;products=await x.json();renderCategories();renderCatalog();renderCartModal()}catch(e){$('catalog').innerHTML='<p>Не удалось загрузить каталог. Обновите страницу.</p>'}}
function updateCartCount(){cart=cart.filter(x=>products.some(p=>p.id===x.id)&&x.quantity>0);$('cartCount').innerText=cart.reduce((s,x)=>s+x.quantity,0);localStorage.setItem('cart',JSON.stringify(cart))}
window.addToCart=id=>{const x=cart.find(i=>i.id===id);x?x.quantity++:cart.push({id,quantity:1});updateCartCount();renderCartModal();showToast('✓ Добавлено','#4ADE80')};
window.openProduct=id=>location.href=`product.html?id=${id}`;
function getPrice(v){return currentCurrency==='USD'?{val:Math.round(v),sym:'$'}:{val:Math.round(v*rubRate),sym:'₽'}}
async function fetchRate(){try{const x=await fetch('https://api.exchangerate-api.com/v4/latest/USD');const d=await x.json();if(d.rates?.RUB)rubRate=d.rates.RUB}catch{}renderCatalog();renderCartModal()}
function renderCategories(){$('categories').innerHTML=categories.map(c=>`<button class="category-btn ${c.id===currentCategory?'active':''}" onclick="setCategory('${c.id}')">${c.name}</button>`).join('')}
window.setCategory=c=>{currentCategory=c;renderCategories();renderCatalog()};
function renderCatalog(){let a=products.filter(p=>(currentCategory==='all'||p.category===currentCategory)&&p.name.toLowerCase().includes(searchQuery));if(sortType==='priceAsc')a.sort((a,b)=>a.price_usd-b.price_usd);if(sortType==='priceDesc')a.sort((a,b)=>b.price_usd-a.price_usd);$('catalog').innerHTML=a.map(p=>{let pr=getPrice(p.price_usd),pm=p.price_usd_max?getPrice(p.price_usd_max):null;return `<div class="product-card"><div class="product-img" onclick="openProduct(${p.id})"><img src="/static/${esc(p.img)}" alt="${esc(p.name)}"></div><div class="product-title" onclick="openProduct(${p.id})">${esc(p.name)}</div><div class="product-desc">${esc(p.desc)}</div><div class="product-price">${pr.val} ${pr.sym}${pm?` – ${pm.val} ${pm.sym}`:''}</div><button class="btn-details" onclick="openProduct(${p.id})">Подробнее</button><button class="btn-add" onclick="addToCart(${p.id})">В корзину</button></div>`}).join('')||'<p>Товары не найдены.</p>'}
function renderCartModal(){updateCartCount();if(!$('cartItems'))return;if(!cart.length){$('cartItems').innerHTML='<p style="padding:20px">Корзина пуста</p>';$('cartTotal').innerText='0 $';return}let total=0;$('cartItems').innerHTML=cart.map(i=>{const p=products.find(x=>x.id===i.id);if(!p)return'';total+=p.price_usd*i.quantity;let pr=getPrice(p.price_usd);return `<div class="cart-item"><img src="/static/${esc(p.img)}"><div class="cart-item-info"><b>${esc(p.name)}</b><br>${pr.val} ${pr.sym}</div><div class="quantity-control"><button onclick="qty(${p.id},-1)">−</button><span>${i.quantity}</span><button onclick="qty(${p.id},1)">+</button></div><button class="remove-item" onclick="removeItem(${p.id})">×</button></div>`}).join('');let t=getPrice(total);$('cartTotal').innerText=`${t.val} ${t.sym}`}
window.qty=(id,d)=>{const x=cart.find(i=>i.id===id);if(x){x.quantity+=d;if(x.quantity<=0)cart=cart.filter(i=>i.id!==id)}renderCartModal();renderCatalog()};window.removeItem=id=>{cart=cart.filter(i=>i.id!==id);renderCartModal()};
function showToast(msg,color){const t=document.createElement('div');t.className='toast';t.style.borderLeftColor=color;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
$('searchInput').oninput=e=>{searchQuery=e.target.value.toLowerCase().trim();renderCatalog()};$('sortSelect').onchange=e=>{sortType=e.target.value;renderCatalog()};
$('currencyBtn').onclick=()=>{currentCurrency=currentCurrency==='USD'?'RUB':'USD';$('currencyBtn').innerText=currentCurrency==='USD'?'$ USD':'₽ RUB';renderCatalog();renderCartModal()};
$('cartIcon').onclick=()=>{$('cartModal').classList.add('show');$('overlay').classList.add('show')};$('closeCartBtn').onclick=()=>{$('cartModal').classList.remove('show');$('overlay').classList.remove('show')};
$('overlay').onclick=()=>{$('cartModal').classList.remove('show');$('contactModal')?.classList.remove('show');$('overlay').classList.remove('show')};
$('checkoutBtn').onclick=()=>{if(!cart.length)return showToast('Корзина пуста','#F87171');localStorage.setItem('checkoutCart',JSON.stringify(cart));localStorage.setItem('checkoutCurrency',currentCurrency);location.href='checkout.html'};
loadProductsFromStorage();fetchRate();
</script>
</body>
</html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CyberPulse.it Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0f;color:#fff;font-family:Inter,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #252530;padding-bottom:16px;margin-bottom:24px}.logo{font-size:22px;font-weight:800}.logo span{color:#8b83ff}.card{background:#111118;border:1px solid #252530;border-radius:18px;padding:20px;margin-bottom:18px}input,select,textarea{width:100%;background:#0d0d14;color:#fff;border:1px solid #30303d;border-radius:10px;padding:11px;margin-top:6px}button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700;background:#6c63ff;color:#fff}.danger{background:#7f1d1d}.muted{color:#aaa}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button.active{outline:2px solid #aaa}.hidden{display:none}.product img{width:70px;height:70px;object-fit:contain;background:#0a0a0f;border-radius:10px}.ph{display:flex;gap:14px;align-items:center}.order .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.login{max-width:420px;margin:80px auto}.toast{position:fixed;right:20px;bottom:20px;background:#181824;border-left:4px solid #6c63ff;padding:14px 18px;border-radius:10px}@media(max-width:650px){.row{grid-template-columns:1fr}.wrap{padding:14px}}
</style></head><body><div class="wrap"><div class="top"><div class="logo">CyberPulse<span>.it</span> Admin</div><div><a href="/" style="color:#aaa;margin-right:12px">Магазин</a><button id="logout" class="hidden">Выйти</button></div></div>
<section id="login" class="card login"><h2>Вход</h2><p class="muted">Авторизация выполняется на сервере.</p><input id="user" placeholder="Логин" autocomplete="username"><input id="pass" type="password" placeholder="Пароль" autocomplete="current-password"><button id="loginBtn" style="width:100%;margin-top:12px">Войти</button></section>
<section id="app" class="hidden"><div class="tabs"><button data-tab="products" class="active">📦 Товары</button><button data-tab="orders">🛒 Заказы</button></div>
<div id="productsTab"><div class="card"><h2 id="formTitle">Добавить товар</h2><input type="hidden" id="pid"><div class="row"><label>Название<input id="name"></label><label>Категория<select id="category"><option value="devices">Устройства</option><option value="modules">Модули</option><option value="firmware">Прошивки</option><option value="accessories">Аксессуары</option></select></label></div><div class="row"><label>Цена USD<input id="price" type="number" min="1" step="0.01"></label><label>Макс. цена USD<input id="priceMax" type="number" min="1" step="0.01"></label></div><label>Файл изображения<input id="img" placeholder="flipper-zero.png"></label><label>Краткое описание<textarea id="desc"></textarea></label><label>Полное описание<textarea id="fullDesc"></textarea></label><label>Характеристики, по одной на строку<textarea id="specs"></textarea></label><label><input id="active" type="checkbox" checked style="width:auto"> Активен</label><div style="margin-top:12px"><button id="save">Сохранить</button> <button id="cancel" type="button" class="hidden">Отмена</button></div></div><div id="products" class="grid"></div></div>
<div id="ordersTab" class="hidden"><div id="orders"></div></div></section></div>
<script>
const $=id=>document.getElementById(id),esc=s=>{let d=document.createElement('div');d.textContent=s??'';return d.innerHTML};let products=[];
function toast(m){let t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});if(r.status===401){showLogin();throw Error('Требуется вход')}let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Ошибка');return d}
function showLogin(){$('login').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden')}function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');loadProducts();loadOrders()}
async function check(){let d=await fetch('/api/admin/me').then(r=>r.json());d.authenticated?showApp():showLogin()}
$('loginBtn').onclick=async()=>{try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('user').value,password:$('pass').value})});$('pass').value='';showApp()}catch(e){toast(e.message)}};$('logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});showLogin()};
async function loadProducts(){products=await api('/api/admin/products');$('products').innerHTML=products.map(p=>`<div class="card product"><div class="ph"><img src="/${esc(p.img)}" onerror="this.src='/static/${esc(p.img)}'"><div><h3>${esc(p.name)}</h3><div>$${p.price_usd}${p.price_usd_max?' – $'+p.price_usd_max:''} · ${esc(p.category)} · ${p.active?'активен':'скрыт'}</div></div></div><p class="muted">${esc(p.desc)}</p><button onclick="edit(${p.id})">Изменить</button> <button class="danger" onclick="del(${p.id})">Скрыть</button></div>`).join('')}
window.edit=id=>{let p=products.find(x=>x.id===id);$('pid').value=p.id;$('name').value=p.name;$('category').value=p.category;$('price').value=p.price_usd;$('priceMax').value=p.price_usd_max||'';$('img').value=p.img;$('desc').value=p.desc;$('fullDesc').value=p.fullDesc;$('specs').value=(p.specs||[]).join('\n');$('active').checked=p.active;$('formTitle').textContent='Редактировать товар';$('cancel').classList.remove('hidden');scrollTo(0,0)};
function reset(){['pid','name','price','priceMax','img','desc','fullDesc','specs'].forEach(x=>$(x).value='');$('active').checked=true;$('formTitle').textContent='Добавить товар';$('cancel').classList.add('hidden')}$('cancel').onclick=reset;
$('save').onclick=async()=>{let id=$('pid').value,p={name:$('name').value.trim(),category:$('category').value,price_usd:Number($('price').value),price_usd_max:$('priceMax').value?Number($('priceMax').value):null,img:$('img').value.trim(),desc:$('desc').value.trim(),fullDesc:$('fullDesc').value.trim(),specs:$('specs').value.split('\n').map(x=>x.trim()).filter(Boolean),active:$('active').checked};try{await api(id?`/api/admin/products/${id}`:'/api/admin/products',{method:id?'PUT':'POST',body:JSON.stringify(p)});reset();await loadProducts();toast('Сохранено')}catch(e){toast(e.message)}};
window.del=async id=>{if(!confirm('Скрыть товар из каталога?'))return;await api(`/api/admin/products/${id}`,{method:'DELETE'});loadProducts()};
async function loadOrders(){let a=await api('/api/admin/orders');$('orders').innerHTML=a.length?a.map(o=>`<div class="card order"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3>${esc(o.number)}</h3><select style="width:auto" onchange="status(${o.id},this.value)">${['new','confirmed','paid','shipped','completed','cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="meta"><span>👤 ${esc(o.fullName)}</span><span>📞 ${esc(o.phone)}</span><span>📍 ${esc(o.city)}</span><span>💳 ${esc(o.payment)}</span></div><p>${o.items.map(i=>`${esc(i.name)} × ${i.quantity}`).join('<br>')}</p><b>Итого: $${o.total_usd.toFixed(2)}</b><p class="muted">${esc(o.address)} · ${esc(o.zip)}<br>${esc(o.email)}${o.comment?'<br>'+esc(o.comment):''}</p></div>`).join(''):'<div class="card">Заказов пока нет.</div>'}
window.status=async(id,status)=>{try{await api(`/api/admin/orders/${id}/status`,{method:'PATCH',body:JSON.stringify({status})});toast('Статус обновлён')}catch(e){toast(e.message)}};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('productsTab').classList.toggle('hidden',b.dataset.tab!=='products');$('ordersTab').classList.toggle('hidden',b.dataset.tab!=='orders');if(b.dataset.tab==='orders')loadOrders()});check();
</script></body></html>
